name: Daily Opportunity Scrape

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 AM IST, every day
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scraper.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit updated opportunities
        run: |
          git config user.name "opportunity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/opportunities.json
          git diff --quiet --cached || git commit -m "Daily opportunities update"
          git push
