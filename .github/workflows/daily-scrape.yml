name: Daily opportunity scrape

on:
  schedule:
    # 03:00 UTC every day (~8:30am IST)
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scraper.py

      - name: Commit local debug JSON if changed
        run: |
          git config user.name "opportunity-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/opportunities.json
          git diff --cached --quiet || git commit -m "chore: refresh debug opportunities.json [skip ci]"
          git push
