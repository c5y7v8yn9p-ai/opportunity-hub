name: Daily opportunity scrape

on:
  schedule:
    # 03:00 UTC every day (~8:30am IST)
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scraper.py

      - name: Commit local debug JSON if changed
        # This step only refreshes a local debug copy of the data (the live
        # site reads straight from Supabase, not this file), so a failure
        # here must never fail the whole run — continue-on-error covers
        # that. The retry loop handles the normal case where the schedule
        # and a manual run (or two manual runs) overlap and both try to
        # push at once: whichever commits second just needs to rebase onto
        # the other's commit and push again.
        continue-on-error: true
        run: |
          git config user.name "opportunity-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/opportunities.json
          if git diff --cached --quiet; then
            echo "No changes to debug JSON — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh debug opportunities.json [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt was rejected (remote moved) — rebasing and retrying..."
            # In case a previous attempt left a half-finished rebase.
            git rebase --abort 2>/dev/null || true
            # -X theirs: this file is regenerated from scratch every run and
            # explicitly documented as non-critical debug output (the live
            # site reads Supabase, never this file) — so on a genuine content
            # conflict (two runs' debug snapshots differ), always keep THIS
            # run's freshly generated version rather than leaving conflict
            # markers for `git rebase` to choke on. Note: during a rebase,
            # "theirs" means the commit being replayed (ours, confusingly) —
            # not the upstream side — this is intentional, not a typo.
            if ! git pull --rebase -X theirs origin main; then
              echo "Rebase still failed — aborting and giving up on this run's debug JSON."
              git rebase --abort 2>/dev/null || true
              break
            fi
            sleep $((RANDOM % 5 + 2))
          done
          echo "Could not push the debug JSON refresh after retries — leaving it for the next run. This does not affect the live site."
