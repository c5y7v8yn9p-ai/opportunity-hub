<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpportunityHub // Opportunity</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=6">
</head>
<body>

  <div class="header">
    <h1><a href="index.html">═ OpportunityHub ═</a></h1>
    <div id="site-nav"></div>
  </div>

  <div class="container narrow" id="detail-mount">
    <div class="loading">loading opportunity…</div>
  </div>

  <footer>SOURCES: HACKER NEWS · GOOGLE NEWS RSS · YOUTUBE (AUTO, DAILY) + USER-SUBMITTED POSTINGS</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js?v=6"></script>
  <script>
    renderNav("opportunities");

    const OPPORTUNITY_TYPE_LABELS = {
      full_time: "Full-time", part_time: "Part-time", contract: "Contract",
      freelance: "Freelance", gig: "Gig", one_time_task: "One-off task",
      project: "Project", seasonal: "Seasonal", internship: "Internship",
      apprenticeship: "Apprenticeship", volunteer: "Volunteer", service_request: "Service request",
    };
    const WORK_MODE_LABELS = { remote: "Remote", hybrid: "Hybrid", local: "Local", relocation: "Relocation", travel: "Travel" };
    const EXPERIENCE_LABELS = { no_experience: "No experience required", beginner: "Entry level", intermediate: "Mid level", advanced: "Senior level", any: "Any level" };
    const GOV_LEVEL_LABELS = {
      central: "Central Govt", state: "State Govt", psu: "PSU", railways: "Railways", banking: "Banking",
      defence: "Defence", police: "Police", teaching: "Teaching", healthcare: "Healthcare", administrative: "Administrative", other: "Other Govt",
    };

    // Some scraped job-board descriptions embed raw HTML (e.g. "<div
    // class=...><p>..."). Strip tags before showing it as plain text —
    // otherwise the tags render literally instead of being invisible markup.
    function stripTags(html) {
      const div = document.createElement("div");
      div.innerHTML = html || "";
      return (div.textContent || div.innerText || "").replace(/\s+\n/g, "\n").trim();
    }

    async function loadDetail() {
      const mount = document.getElementById("detail-mount");
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) { mount.innerHTML = '<div class="empty">No opportunity id given.</div>'; return; }
      if (!window.sb) { mount.innerHTML = '<div class="empty">Supabase isn\'t configured yet.</div>'; return; }

      const { data: opp, error } = await window.sb
        .from("opportunities")
        .select("*, profiles:posted_by ( username, id ), industries:industry_id ( name )")
        .eq("id", id)
        .maybeSingle();

      if (error || !opp) {
        mount.innerHTML = `<div class="empty">Could not load this opportunity${error ? ": " + escapeHtml(error.message) : " — it may have been removed"}.</div>`;
        return;
      }

      document.title = "OpportunityHub // " + (opp.title || "Opportunity");

      const metaChips = [];
      if (opp.industries && opp.industries.name) metaChips.push(opp.industries.name);
      if (opp.opportunity_type) metaChips.push(OPPORTUNITY_TYPE_LABELS[opp.opportunity_type] || opp.opportunity_type);
      if (opp.work_mode) metaChips.push(WORK_MODE_LABELS[opp.work_mode] || opp.work_mode);
      if (opp.city || opp.location) metaChips.push(opp.city || opp.location);
      if (opp.experience_level) metaChips.push(EXPERIENCE_LABELS[opp.experience_level] || opp.experience_level);

      let payLine = "";
      if (opp.pay_min) {
        const cur = opp.pay_currency || "INR";
        payLine = opp.pay_max && opp.pay_max !== opp.pay_min ? `${cur} ${opp.pay_min}–${opp.pay_max}` : `${cur} ${opp.pay_min}+`;
      } else if (opp.money_mentioned) {
        payLine = opp.money_mentioned;
      }

      const applyHref = opp.source_type === "user" && opp.posted_by ? `profile.html?id=${opp.posted_by}` : opp.url;
      const applyLabel = opp.source_type === "user" ? "View poster" : opp.status === "speculative" ? "Read the signal source" : "Apply / visit source";

      const user = await Auth.getUser();
      const savedIds = user ? await Auth.getSavedIds(user.id) : new Set();
      const isSaved = savedIds.has(opp.id);
      const profile = user ? await Auth.getProfile(user.id) : null;
      const dna = profile && profile.onboarding_completed ? profile.dna : null;

      window.OH_logEvent(user && user.id, opp.id, "view");

      const specBanner = opp.status === "speculative" ? `
        <div class="speculative-banner">
          <b>💡 Speculative lead</b> — this was generated from a news signal, not a confirmed job or gig posting.
          Nobody has posted this opportunity; verify directly with the company before acting on it.
        </div>` : "";

      // Government listings get a trust-first treatment (spec section 17):
      // the futuristic scoring/why-list still surrounds it, but the core
      // facts are plain and undecorated. We only show fields we actually
      // have — no invented vacancy counts or eligibility text.
      const govBlock = opp.government_level ? `
        <div class="detail-section">
          <div class="detail-section-label">Government Opportunity — ${escapeHtml(GOV_LEVEL_LABELS[opp.government_level] || opp.government_level)}</div>
          <div class="score-row">${window.OH_trustBadgeHtml(opp)}</div>
          ${opp.department ? `<div class="detail-body" style="margin-top:0.4rem;"><b>Department:</b> ${escapeHtml(opp.department)}</div>` : ""}
          <div class="last-checked">Last checked ${opp.last_verified_at ? timeAgo(opp.last_verified_at) : (opp.created_at ? timeAgo(opp.created_at) : "unknown")}</div>
        </div>` : "";

      const scoreRow = `
        <div class="score-row">
          ${dna ? (() => { const m = window.OH_computeDnaScore(opp, dna); return m > 0 ? `<div class="score-pill match"><span class="sp-label">Match</span><span class="sp-value">${m}%</span></div>` : ""; })() : ""}
          ${(() => { const q = window.OH_qualityBucket(opp); return opp.status === "speculative" ? "" : `<div class="score-pill ${q.cls}"><span class="sp-label">Quality</span><span class="sp-value">${q.label}</span></div>`; })()}
          <div class="score-pill"><span class="sp-label">Confidence</span><span class="sp-value">${window.OH_computeConfidence(opp)}%</span></div>
        </div>
        <div class="score-row">${window.OH_trustBadgeHtml(opp)}</div>
      `;

      const whyList = dna ? window.OH_whyListHtml(opp, dna) : "";

      mount.innerHTML = `
        <div class="detail-box">
          ${specBanner}
          <div class="detail-title">${escapeHtml(opp.title || "Untitled opportunity")}</div>
          <div class="detail-sub">${escapeHtml(opp.source || (opp.profiles ? "Posted by " + opp.profiles.username : ""))} · ${opp.created_at ? timeAgo(opp.created_at) : ""}</div>
          ${scoreRow}
          ${whyList ? `<div class="detail-section-label">Why This Matches</div>${whyList}` : ""}
          <div class="detail-meta-row">
            ${metaChips.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
            ${payLine ? `<span class="tag accent">${escapeHtml(payLine)}</span>` : ""}
          </div>

          ${govBlock}

          <div class="detail-section">
            <div class="detail-section-label">Description</div>
            <div class="detail-body">${escapeHtml(stripTags(opp.body) || "No description provided.")}</div>
          </div>

          ${opp.end_date ? `
          <div class="detail-section">
            <div class="detail-section-label">Deadline</div>
            <div class="detail-body">${escapeHtml(new Date(opp.end_date).toLocaleDateString())}</div>
          </div>` : ""}

          <div class="detail-actions">
            ${applyHref ? `<a class="btn-primary" id="apply-link" href="${applyHref}" target="${opp.source_type === "user" ? "_self" : "_blank"}" rel="noopener">${applyLabel} →</a>` : ""}
            <button type="button" class="btn-secondary" id="save-detail-btn">${isSaved ? "★ Saved" : "☆ Save"}</button>
          </div>

          <div class="detail-section" id="related-signal-mount"></div>
          <div class="detail-section" id="related-opps-mount"></div>
        </div>
      `;

      const applyLink = document.getElementById("apply-link");
      if (applyLink) applyLink.addEventListener("click", () => window.OH_logEvent(user && user.id, opp.id, "apply_click"));

      document.getElementById("save-detail-btn").addEventListener("click", async () => {
        if (!user) { Auth.requireLogin(); return; }
        const btn = document.getElementById("save-detail-btn");
        try {
          if (savedIds.has(opp.id)) {
            await Auth.unsaveOpportunity(user.id, opp.id);
            savedIds.delete(opp.id);
            btn.textContent = "☆ Save";
          } else {
            await Auth.saveOpportunity(user.id, opp.id);
            savedIds.add(opp.id);
            btn.textContent = "★ Saved";
          }
        } catch (err) { alert("Could not update: " + (err.message || err)); }
      });

      if (opp.signal_id) {
        const { data: signal } = await window.sb
          .from("news_items")
          .select("title, url, category, signal_type, source, company, published_at")
          .eq("id", opp.signal_id)
          .maybeSingle();
        if (signal) {
          document.getElementById("related-signal-mount").innerHTML = `
            <div class="detail-section-label">Related Signal</div>
            ${window.OH_evidenceChainHtml(signal)}
            <div class="signal-card" style="margin-top:0.6rem;">
              <div class="sc-title"><a href="${escapeHtml(signal.url)}" target="_blank" rel="noopener">${escapeHtml(signal.title)}</a></div>
              <div class="sc-meta">
                <span class="news-item-meta">${escapeHtml(signal.source || "")} · ${signal.published_at ? timeAgo(signal.published_at) : ""}</span>
              </div>
            </div>`;
        }
      }

      if (opp.industry_id) {
        const { data: related } = await window.sb
          .from("opportunities")
          .select("id, title, work_mode, city, location, score, status")
          .eq("industry_id", opp.industry_id)
          .eq("status", "active")
          .neq("id", opp.id)
          .order("score", { ascending: false })
          .limit(4);
        if (related && related.length) {
          document.getElementById("related-opps-mount").innerHTML = `
            <div class="detail-section-label">Related Opportunities</div>
            <div class="related-grid">
              ${related.map((r) => `
                <div class="mini-card" style="cursor:default;">
                  <div class="mc-title"><a href="opportunity.html?id=${r.id}" style="text-decoration:none;color:inherit;">${escapeHtml(r.title)}</a></div>
                  <div class="mc-meta">
                    ${r.work_mode ? `<span class="tag">${escapeHtml(WORK_MODE_LABELS[r.work_mode] || r.work_mode)}</span>` : ""}
                    ${r.city || r.location ? `<span class="tag">${escapeHtml(r.city || r.location)}</span>` : ""}
                  </div>
                </div>`).join("")}
            </div>`;
        }
      }
    }

    loadDetail();
  </script>
</body>
</html>
