<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpportunityHub // Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <div class="header">
    <h1><a href="index.html">═ OpportunityHub ═</a></h1>
    <div class="tagline">User profile</div>
    <div id="site-nav"></div>
  </div>

  <div class="container narrow">
    <div id="profile-body"><div class="loading">loading profile...</div></div>

    <div id="edit-box" class="form-box" style="display:none;">
      <div class="box-title" style="margin-top:0;">Edit Your Profile</div>
      <div class="form-row">
        <label>Bio</label>
        <textarea id="edit-bio" maxlength="300"></textarea>
      </div>
      <div class="form-row">
        <label>Location</label>
        <input type="text" id="edit-location" maxlength="60">
      </div>
      <button class="btn-primary" id="save-profile-btn">Save</button>
      <div class="form-msg" id="edit-msg"></div>
    </div>

    <div id="rate-box" class="form-box" style="display:none;">
      <div class="box-title" style="margin-top:0;">Leave a Rating</div>
      <div class="form-row">
        <label>Stars (1-5)</label>
        <select id="rate-stars">
          <option value="5">5 — excellent</option>
          <option value="4">4 — good</option>
          <option value="3">3 — okay</option>
          <option value="2">2 — poor</option>
          <option value="1">1 — bad</option>
        </select>
      </div>
      <div class="form-row">
        <label>Comment (optional)</label>
        <textarea id="rate-comment" maxlength="300"></textarea>
      </div>
      <button class="btn-primary" id="submit-rating-btn">Submit Rating</button>
      <div class="form-msg" id="rate-msg"></div>
    </div>

    <div class="box-title">Ratings</div>
    <div id="ratings-list"><div class="loading">loading...</div></div>

    <div class="box-title">Posted Opportunities</div>
    <div id="user-opps" class="opp-grid"><div class="loading">loading...</div></div>
  </div>

  <footer>RATINGS ARE PUBLIC AND CANNOT BE DELETED ONCE SUBMITTED</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    renderNav(null);

    const params = new URLSearchParams(window.location.search);
    const profileId = params.get("id");

    (async function init() {
      if (!window.OH_CONFIGURED) {
        document.getElementById("profile-body").innerHTML =
          '<div class="empty">Supabase isn\'t configured yet — see SETUP_GUIDE.md.</div>';
        return;
      }
      if (!profileId) {
        document.getElementById("profile-body").innerHTML = '<div class="empty">no profile id given</div>';
        return;
      }

      const me = await Auth.getUser();
      const { data: profile, error } = await window.sb
        .from("profiles")
        .select("*")
        .eq("id", profileId)
        .maybeSingle();

      if (error || !profile) {
        document.getElementById("profile-body").innerHTML = '<div class="empty">profile not found</div>';
        return;
      }

      const isMe = me && me.id === profileId;

      document.getElementById("profile-body").innerHTML = `
        <div class="box-title" style="margin-top:0;">${escapeHtml(profile.username)}</div>
        <div class="form-box">
          <div class="stars">${starString(profile.rating_avg)}</div>
          <div style="opacity:0.7; font-size:0.75rem; margin:0.3rem 0 0.8rem;">
            ${profile.rating_count} rating${profile.rating_count === 1 ? "" : "s"} · avg ${Number(profile.rating_avg || 0).toFixed(1)}/5
          </div>
          ${profile.location ? `<div class="tag" style="display:inline-block; margin-bottom:0.6rem;">${escapeHtml(profile.location)}</div>` : ""}
          <div style="font-size:0.85rem; opacity:0.9;">${escapeHtml(profile.bio || "(no bio yet)")}</div>
          ${!isMe && me ? `<div style="margin-top:1rem;"><a class="btn-secondary" href="messages.html?to=${profile.id}">Message</a></div>` : ""}
          ${!me ? `<div style="margin-top:1rem; font-size:0.75rem;"><a href="auth.html">Log in</a> to message or rate this user.</div>` : ""}
        </div>
      `;

      if (isMe) {
        document.getElementById("edit-box").style.display = "block";
        document.getElementById("edit-bio").value = profile.bio || "";
        document.getElementById("edit-location").value = profile.location || "";
        document.getElementById("save-profile-btn").addEventListener("click", async () => {
          const msg = document.getElementById("edit-msg");
          try {
            const { error } = await window.sb
              .from("profiles")
              .update({
                bio: document.getElementById("edit-bio").value.trim(),
                location: document.getElementById("edit-location").value.trim(),
              })
              .eq("id", me.id);
            if (error) throw error;
            msg.className = "form-msg ok";
            msg.textContent = "Saved.";
          } catch (err) {
            msg.className = "form-msg err";
            msg.textContent = err.message || "Could not save.";
          }
        });
      } else if (me) {
        document.getElementById("rate-box").style.display = "block";
        document.getElementById("submit-rating-btn").addEventListener("click", async () => {
          const msg = document.getElementById("rate-msg");
          try {
            const { error } = await window.sb.from("ratings").insert({
              rater_id: me.id,
              rated_id: profileId,
              stars: Number(document.getElementById("rate-stars").value),
              comment: document.getElementById("rate-comment").value.trim(),
            });
            if (error) throw error;
            msg.className = "form-msg ok";
            msg.textContent = "Rating submitted.";
            loadRatings();
          } catch (err) {
            msg.className = "form-msg err";
            msg.textContent = err.message.includes("duplicate")
              ? "You've already rated this user."
              : err.message || "Could not submit rating.";
          }
        });
      }

      async function loadRatings() {
        const { data: ratings } = await window.sb
          .from("ratings")
          .select("*, profiles:rater_id ( username )")
          .eq("rated_id", profileId)
          .order("created_at", { ascending: false });
        const box = document.getElementById("ratings-list");
        if (!ratings || ratings.length === 0) {
          box.innerHTML = '<div class="empty">no ratings yet</div>';
          return;
        }
        box.innerHTML = ratings
          .map(
            (r) => `<div class="rating-item">
              <span class="stars">${starString(r.stars)}</span>
              — ${escapeHtml((r.profiles && r.profiles.username) || "user")}
              ${r.comment ? `<div style="opacity:0.75; margin-top:0.2rem;">${escapeHtml(r.comment)}</div>` : ""}
            </div>`
          )
          .join("");
      }
      loadRatings();

      const { data: opps } = await window.sb
        .from("opportunities")
        .select("*")
        .eq("posted_by", profileId)
        .order("created_at", { ascending: false });
      const oppsBox = document.getElementById("user-opps");
      if (!opps || opps.length === 0) {
        oppsBox.innerHTML = '<div class="empty">no postings yet</div>';
      } else {
        oppsBox.innerHTML = opps
          .map(
            (opp) => `<div class="opp-card">
              <div class="card-title">${escapeHtml(opp.title)}</div>
              <div class="card-text">${escapeHtml(opp.body || "")}</div>
              <div class="card-footer"><span>${timeAgo(opp.created_at)}</span></div>
            </div>`
          )
          .join("");
      }
    })();
  </script>
</body>
</html>
